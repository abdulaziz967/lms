<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS - Working Cross-Device System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  .auth-card h2 { margin-bottom: 10px; color: #333; }
  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
  .input-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
  .btn { padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 16px; transition: all 0.3s; }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; width: 100%; }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-outline { background: transparent; border: 2px solid #667eea; color: #667eea; }
  .switch-link { text-align: center; margin-top: 20px; color: #666; }
  .switch-link a { color: #667eea; cursor: pointer; text-decoration: underline; }
  .app-header { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  .logo h1 { font-size: 1.5rem; color: #667eea; }
  .user-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 8px 16px; border-radius: 50px; }
  .status-badge { padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; }
  .status-approved { background: #4caf50; color: white; }
  .status-pending { background: #ff9800; color: white; }
  .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: white; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: transform 0.3s; }
  .stat-card:hover { transform: translateY(-3px); }
  .stat-number { font-size: 2rem; font-weight: bold; color: #667eea; }
  .section { background: white; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
  .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .subject-card { background: #f8f9fa; border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
  .subject-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: #667eea; }
  .quiz-container { background: #f8f9fa; border-radius: 20px; padding: 24px; }
  .question-text { font-size: 1.2rem; margin-bottom: 20px; font-weight: 500; }
  .option { padding: 12px; background: white; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
  .option:hover { border-color: #667eea; background: #f0f0ff; }
  .option.selected { border-color: #667eea; background: linear-gradient(135deg, #667eea20, #764ba220); }
  .timer { font-size: 1.5rem; text-align: center; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 12px; margin-bottom: 20px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
  th { background: #f8f9fa; font-weight: 600; }
  .icon-btn { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; margin: 2px; font-size: 14px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1000; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .admin-tab { padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 50px; cursor: pointer; font-weight: 500; transition: all 0.3s; }
  .admin-tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  .loading { text-align: center; padding: 20px; color: #666; }
  @media (max-width: 768px) { .auth-card { margin: 20px; padding: 30px; } }
</style>
</head>
<body>
<div id="app">Loading...</div>

<script>
// ============================================
// CONFIGURATION - REPLACE WITH YOUR SHEET.BEST URL
// ============================================
const SHEET_BEST_URL = "https://api.sheetbest.com/sheets/2f4eddf6-0530-4254-b2aa-f6778ea304ac"; // 👈 PASTE YOUR URL!

// Sample subjects data
const DEFAULT_SUBJECTS = [
  {
    id: 1,
    name: "Mathematics",
    description: "Algebra, Geometry, Calculus",
    passingScore: 60,
    timeLimit: 300,
    questions: [
      { id: 1, text: "What is 15 × 8?", options: ["100", "110", "120", "130"], correct: 2, points: 10 },
      { id: 2, text: "What is the square root of 144?", options: ["10", "11", "12", "13"], correct: 2, points: 10 },
      { id: 3, text: "Solve: 45 + 37 = ?", options: ["72", "82", "92", "102"], correct: 1, points: 10 },
      { id: 4, text: "What is 25% of 200?", options: ["25", "50", "75", "100"], correct: 1, points: 10 },
      { id: 5, text: "If x = 5, what is 3x + 7?", options: ["18", "20", "22", "24"], correct: 2, points: 10 }
    ]
  },
  {
    id: 2,
    name: "English Grammar",
    description: "Tenses, Parts of Speech",
    passingScore: 60,
    timeLimit: 300,
    questions: [
      { id: 1, text: "Choose the correct sentence:", options: ["He go to school", "He goes to school", "He going to school", "He gone to school"], correct: 1, points: 10 },
      { id: 2, text: "What is the past tense of 'run'?", options: ["Run", "Ran", "Runned", "Running"], correct: 1, points: 10 },
      { id: 3, text: "Which word is a noun?", options: ["Beautiful", "Quickly", "Happiness", "Run"], correct: 2, points: 10 },
      { id: 4, text: "What is the antonym of 'expensive'?", options: ["Cheap", "Costly", "Valuable", "Pricey"], correct: 0, points: 10 },
      { id: 5, text: "Fill in the blank: She ___ to the store yesterday.", options: ["go", "goes", "went", "going"], correct: 2, points: 10 }
    ]
  },
  {
    id: 3,
    name: "Science",
    description: "Physics, Chemistry, Biology",
    passingScore: 60,
    timeLimit: 300,
    questions: [
      { id: 1, text: "What is the chemical symbol for Gold?", options: ["Go", "Gd", "Au", "Ag"], correct: 2, points: 10 },
      { id: 2, text: "What is the hardest natural substance?", options: ["Iron", "Gold", "Diamond", "Platinum"], correct: 2, points: 10 },
      { id: 3, text: "What planet is known as the Red Planet?", options: ["Jupiter", "Mars", "Venus", "Saturn"], correct: 1, points: 10 },
      { id: 4, text: "What gas do plants absorb?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 2, points: 10 },
      { id: 5, text: "What is the boiling point of water?", options: ["90°C", "100°C", "110°C", "120°C"], correct: 1, points: 10 }
    ]
  }
];

// Global variables
let users = [];
let subjects = [];
let currentUser = null;

// Helper function to show toast messages
function showToast(message, isError = false) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  toast.style.background = isError ? '#f44336' : '#333';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ============================================
// DATABASE FUNCTIONS (using Sheet.best)
// ============================================

async function fetchUsers() {
  try {
    const response = await fetch(`${SHEET_BEST_URL}/search?role=student`);
    if (response.ok) {
      users = await response.json();
    } else {
      users = [];
    }
    
    // Check if admin exists
    const adminCheck = await fetch(`${SHEET_BEST_URL}/search?email=admin@lms.com`);
    if (adminCheck.ok) {
      const adminData = await adminCheck.json();
      if (adminData.length === 0) {
        // Create admin
        await fetch(SHEET_BEST_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: Date.now(),
            name: "Admin User",
            email: "admin@lms.com",
            password: "admin123",
            role: "admin",
            status: "approved",
            registeredAt: new Date().toISOString(),
            points: 0
          })
        });
      }
    }
    
    return true;
  } catch (err) {
    console.error("Fetch users error:", err);
    return false;
  }
}

async function fetchSubjects() {
  try {
    // Try to get subjects from sheet
    const response = await fetch(`${SHEET_BEST_URL}/search?type=subject`);
    if (response.ok) {
      const data = await response.json();
      if (data.length > 0) {
        subjects = data;
        return true;
      }
    }
    
    // If no subjects, create default ones
    subjects = DEFAULT_SUBJECTS;
    for (const subject of subjects) {
      await fetch(SHEET_BEST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...subject, type: "subject" })
      });
    }
    return true;
  } catch (err) {
    console.error("Fetch subjects error:", err);
    subjects = DEFAULT_SUBJECTS;
    return true;
  }
}

async function registerUser(name, email, password) {
  try {
    // Check if email exists
    const checkResponse = await fetch(`${SHEET_BEST_URL}/search?email=${encodeURIComponent(email)}`);
    const existing = await checkResponse.json();
    
    if (existing.length > 0) {
      return { success: false, error: "Email already exists" };
    }
    
    const newUser = {
      id: Date.now(),
      name: name,
      email: email,
      password: password,
      role: "student",
      status: "pending",
      registeredAt: new Date().toISOString(),
      points: 0,
      results: JSON.stringify([])
    };
    
    const response = await fetch(SHEET_BEST_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newUser)
    });
    
    if (response.ok) {
      return { success: true };
    } else {
      return { success: false, error: "Registration failed" };
    }
  } catch (err) {
    console.error("Register error:", err);
    return { success: false, error: err.message };
  }
}

async function approveUser(userId) {
  try {
    // First find the user
    const response = await fetch(`${SHEET_BEST_URL}/search?id=${userId}`);
    const users = await response.json();
    
    if (users.length > 0) {
      const user = users[0];
      user.status = "approved";
      
      await fetch(`${SHEET_BEST_URL}/update/${user.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
      });
      return { success: true };
    }
    return { success: false };
  } catch (err) {
    console.error("Approve error:", err);
    return { success: false };
  }
}

async function saveUserResult(userId, subjectId, score, correct, total, points) {
  try {
    // Get user
    const response = await fetch(`${SHEET_BEST_URL}/search?id=${userId}`);
    const usersList = await response.json();
    
    if (usersList.length > 0) {
      const user = usersList[0];
      let results = [];
      try {
        results = JSON.parse(user.results || "[]");
      } catch(e) { results = []; }
      
      results.push({
        subjectId: subjectId,
        score: score,
        correct: correct,
        total: total,
        points: points,
        date: new Date().toISOString()
      });
      
      user.results = JSON.stringify(results);
      user.points = (user.points || 0) + points;
      
      await fetch(`${SHEET_BEST_URL}/update/${user.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
      });
      return { success: true };
    }
    return { success: false };
  } catch (err) {
    console.error("Save result error:", err);
    return { success: false };
  }
}

// ============================================
// AUTH SCREENS
// ============================================

async function renderAuthScreen() {
  await fetchUsers();
  await fetchSubjects();
  
  document.getElementById('app').innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <h2>📚 LMS Cloud</h2>
        <p style="color: #666; margin-bottom: 30px;">Cross-Device Learning System</p>
        <div id="authForm">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter your name">
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Enter your email">
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password">
          </div>
          <button class="btn btn-primary" onclick="register()">Register as Student</button>
          <div class="switch-link">
            Already have an account? <a onclick="showLogin()">Login here</a>
          </div>
          <div class="switch-link">
            Admin login? <a onclick="showAdminLogin()">Admin Access</a>
          </div>
        </div>
        <div style="margin-top: 20px; font-size: 11px; text-align: center; color: #999;">
          ✅ Cloud Connected - Cross Device Sync Active
        </div>
      </div>
    </div>
  `;
}

function showLogin() {
  document.getElementById('authForm').innerHTML = `
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
    </div>
    <button class="btn btn-primary" onclick="login()">Student Login</button>
    <div class="switch-link">
      Don't have an account? <a onclick="renderAuthScreen()">Register here</a>
    </div>
    <div class="switch-link">
      Admin login? <a onclick="showAdminLogin()">Admin Access</a>
    </div>
  `;
}

function showAdminLogin() {
  document.getElementById('authForm').innerHTML = `
    <div class="input-group">
      <label>Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@lms.com">
    </div>
    <div class="input-group">
      <label>Admin Password</label>
      <input type="password" id="adminPassword" placeholder="admin123">
    </div>
    <button class="btn btn-primary" onclick="adminLogin()">Admin Login</button>
    <div class="switch-link">
      Student login? <a onclick="showLogin()">Student Login</a>
    </div>
  `;
}

async function register() {
  const name = document.getElementById('regName')?.value.trim();
  const email = document.getElementById('regEmail')?.value.trim();
  const password = document.getElementById('regPassword')?.value;
  
  if (!name || !email || !password) {
    showToast('Please fill all fields', true);
    return;
  }
  
  showToast('Registering...');
  
  const result = await registerUser(name, email, password);
  
  if (result.success) {
    showToast('✅ Registration successful! Waiting for admin approval.');
    showLogin();
  } else {
    showToast(result.error || 'Registration failed. Please try again.', true);
  }
}

async function login() {
  const email = document.getElementById('loginEmail')?.value;
  const password = document.getElementById('loginPassword')?.value;
  
  await fetchUsers();
  
  const user = users.find(u => u.email === email && u.password === password);
  
  if (!user) {
    showToast('Invalid email or password', true);
    return;
  }
  
  if (user.status !== 'approved') {
    showToast(`Your account is ${user.status}. Please wait for admin approval.`, true);
    return;
  }
  
  // Parse results
  if (user.results && typeof user.results === 'string') {
    user.results = JSON.parse(user.results);
  }
  
  currentUser = user;
  sessionStorage.setItem('lms_current_user', JSON.stringify(currentUser));
  renderStudentDashboard();
}

async function adminLogin() {
  const email = document.getElementById('adminEmail')?.value;
  const password = document.getElementById('adminPassword')?.value;
  
  await fetchUsers();
  
  const admin = users.find(u => u.email === email && u.password === password && u.role === 'admin');
  
  if (!admin) {
    showToast('Invalid admin credentials. Use admin@lms.com / admin123', true);
    return;
  }
  
  currentUser = admin;
  sessionStorage.setItem('lms_current_user', JSON.stringify(currentUser));
  renderAdminDashboard();
  
  const pendingCount = users.filter(u => u.status === 'pending').length;
  showToast(`Welcome Admin! ${pendingCount} student(s) pending approval.`);
}

function logout() {
  sessionStorage.removeItem('lms_current_user');
  currentUser = null;
  renderAuthScreen();
}

// ============================================
// STUDENT DASHBOARD
// ============================================

let selectedSubject = null;
let currentQuestionIndex = 0;
let userAnswers = {};
let timerInterval = null;
let timeRemaining = 0;

async function renderStudentDashboard() {
  await fetchUsers();
  await fetchSubjects();
  
  // Update current user with latest data
  const updatedUser = users.find(u => u.id === currentUser.id);
  if (updatedUser) {
    if (updatedUser.results && typeof updatedUser.results === 'string') {
      updatedUser.results = JSON.parse(updatedUser.results);
    }
    currentUser = updatedUser;
    sessionStorage.setItem('lms_current_user', JSON.stringify(currentUser));
  }
  
  const totalPoints = currentUser.points || 0;
  const testsCompleted = currentUser.results?.length || 0;
  const avgScore = testsCompleted > 0 ? Math.round(currentUser.results.reduce((s, r) => s + r.score, 0) / testsCompleted) : 0;
  
  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="app-header">
        <div class="logo"><h1>📚 Student Portal</h1></div>
        <div class="user-info">
          <span class="user-badge">👤 ${currentUser.name}</span>
          <span class="status-badge status-approved">✅ Approved</span>
          <span class="user-badge">⭐ ${totalPoints} pts</span>
          <button class="btn btn-outline" onclick="logout()" style="padding: 8px 16px;">Logout</button>
        </div>
      </div>
      
      <div class="dashboard-stats">
        <div class="stat-card"><div class="stat-number">${totalPoints}</div><div>🏆 Total Points</div></div>
        <div class="stat-card"><div class="stat-number">${testsCompleted}</div><div>📊 Tests Taken</div></div>
        <div class="stat-card"><div class="stat-number">${avgScore}%</div><div>📈 Average Score</div></div>
      </div>
      
      <div class="section">
        <h3>📖 Available Subjects</h3>
        <div class="subjects-grid" id="subjectsGrid"></div>
      </div>
      
      <div id="quizArea" style="display: none;"></div>
    </div>
  `;
  
  const grid = document.getElementById('subjectsGrid');
  if (grid) {
    grid.innerHTML = subjects.map(sub => {
      const existingResult = currentUser.results?.find(r => r.subjectId === sub.id);
      return `
        <div class="subject-card" onclick="startQuiz(${sub.id})">
          <div class="subject-name">📘 ${sub.name}</div>
          <div>${sub.questions.length} questions • ${Math.floor(sub.timeLimit / 60)} min</div>
          ${existingResult ? `<div style="margin-top: 8px; color: ${existingResult.score >= 60 ? '#4caf50' : '#f44336'}">Previous Score: ${existingResult.score}%</div>` : ''}
        </div>
      `;
    }).join('');
  }
}

function startQuiz(subjectId) {
  selectedSubject = subjects.find(s => s.id === subjectId);
  currentQuestionIndex = 0;
  userAnswers = {};
  timeRemaining = selectedSubject.timeLimit;
  renderQuiz();
  startTimer();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timeRemaining <= 0) {
      clearInterval(timerInterval);
      submitQuiz(true);
    } else {
      timeRemaining--;
      const timerDiv = document.getElementById('timerDisplay');
      if (timerDiv) {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        timerDiv.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
        if (timeRemaining < 60) {
          timerDiv.style.background = "#f44336";
        }
      }
    }
  }, 1000);
}

function renderQuiz() {
  const qa = document.getElementById('quizArea');
  const q = selectedSubject.questions[currentQuestionIndex];
  
  qa.style.display = 'block';
  qa.innerHTML = `
    <div class="section">
      <h3>${selectedSubject.name} Quiz</h3>
      <div class="timer" id="timerDisplay"></div>
      <div class="quiz-container">
        <div style="margin-bottom: 10px; color: #666;">Question ${currentQuestionIndex + 1} of ${selectedSubject.questions.length}</div>
        <div class="question-text">${q.text}</div>
        <div id="optionsList"></div>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
          <button class="btn btn-outline" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>◀ Previous</button>
          <button class="btn btn-primary" onclick="nextQuestion()">${currentQuestionIndex === selectedSubject.questions.length - 1 ? 'Submit Quiz' : 'Next ▶'}</button>
        </div>
      </div>
    </div>
  `;
  
  renderOptions();
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const timerDiv = document.getElementById('timerDisplay');
  if (timerDiv) {
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    timerDiv.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
  }
}

function renderOptions() {
  const optsDiv = document.getElementById('optionsList');
  const q = selectedSubject.questions[currentQuestionIndex];
  const savedAnswer = userAnswers[currentQuestionIndex];
  
  optsDiv.innerHTML = q.options.map((opt, idx) => `
    <div class="option ${savedAnswer === idx ? 'selected' : ''}" onclick="selectAnswer(${idx})">
      ${String.fromCharCode(65 + idx)}. ${opt}
    </div>
  `).join('');
}

function selectAnswer(idx) {
  userAnswers[currentQuestionIndex] = idx;
  renderOptions();
}

function previousQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuiz();
  }
}

function nextQuestion() {
  if (currentQuestionIndex === selectedSubject.questions.length - 1) {
    submitQuiz(false);
  } else {
    currentQuestionIndex++;
    renderQuiz();
  }
}

async function submitQuiz(isTimeout) {
  if (timerInterval) clearInterval(timerInterval);
  
  let correct = 0;
  let points = 0;
  
  selectedSubject.questions.forEach((q, idx) => {
    if (userAnswers[idx] === q.correct) {
      correct++;
      points += q.points;
    }
  });
  
  const score = Math.round((correct / selectedSubject.questions.length) * 100);
  
  await saveUserResult(currentUser.id, selectedSubject.id, score, correct, selectedSubject.questions.length, points);
  
  showToast(`${isTimeout ? '⏰ Time\'s up! ' : ''}Score: ${score}% ${score >= selectedSubject.passingScore ? '🎉 Passed! +' + points + ' pts' : '📚 Keep practicing!'}`);
  
  renderStudentDashboard();
}

// ============================================
// ADMIN DASHBOARD
// ============================================

let adminActiveTab = 'users';

async function renderAdminDashboard() {
  await fetchUsers();
  await fetchSubjects();
  
  const pendingCount = users.filter(u => u.role === 'student' && u.status === 'pending').length;
  const studentCount = users.filter(u => u.role === 'student').length;
  const totalPoints = users.reduce((sum, u) => sum + (u.points || 0), 0);
  
  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="app-header">
        <div class="logo"><h1>👑 Admin Portal</h1></div>
        <div class="user-info">
          <span class="user-badge">Admin: ${currentUser.name}</span>
          <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
      </div>
      
      <div class="dashboard-stats">
        <div class="stat-card"><div class="stat-number">${studentCount}</div><div>Total Students</div></div>
        <div class="stat-card"><div class="stat-number" style="color: #ff9800;">${pendingCount}</div><div>Pending Approvals</div></div>
        <div class="stat-card"><div class="stat-number">${subjects.length}</div><div>Subjects</div></div>
        <div class="stat-card"><div class="stat-number">${totalPoints}</div><div>Total Points</div></div>
      </div>
      
      <div class="section">
        <div class="admin-tabs">
          <button class="admin-tab ${adminActiveTab === 'users' ? 'active' : ''}" onclick="switchAdminTab('users')">👥 User Management</button>
          <button class="admin-tab ${adminActiveTab === 'subjects' ? 'active' : ''}" onclick="switchAdminTab('subjects')">📚 Subjects</button>
        </div>
        <div id="adminContent"></div>
      </div>
    </div>
  `;
  
  renderAdminContent();
}

function switchAdminTab(tab) {
  adminActiveTab = tab;
  renderAdminDashboard();
}

function renderAdminContent() {
  const content = document.getElementById('adminContent');
  
  if (adminActiveTab === 'users') {
    const pending = users.filter(u => u.role === 'student' && u.status === 'pending');
    const approved = users.filter(u => u.role === 'student' && u.status === 'approved');
    
    content.innerHTML = `
      <h3>⏳ Pending Approvals <span style="background:#ff9800; padding:2px 8px; border-radius:20px; font-size:12px;">${pending.length} waiting</span></h3>
      ${pending.length === 0 ? '<p style="color:#4caf50; padding:20px; text-align:center;">✅ No pending approvals</p>' : `
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Registered</th><th>Action</th></tr></thead>
        <tbody>
          ${pending.map(u => `
            <tr>
              <td>${u.name}</td>
              <td>${u.email}</td>
              <td>${new Date(u.registeredAt).toLocaleDateString()}</td>
              <td><button class="icon-btn" style="background:#4caf50;color:white;" onclick="approveUser(${u.id})">✅ Approve</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      `}
      
      <h3 style="margin-top: 30px;">✅ Approved Students (${approved.length})</h3>
      ${approved.length === 0 ? '<p style="color:#666; padding:20px; text-align:center;">No approved students yet</p>' : `
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Tests Taken</th><th>Points</th><th>Avg Score</th></tr></thead>
        <tbody>
          ${approved.map(u => {
            const results = u.results && typeof u.results === 'string' ? JSON.parse(u.results) : (u.results || []);
            const avgScore = results.length > 0 ? Math.round(results.reduce((s, r) => s + r.score, 0) / results.length) : 0;
            return `
              <tr>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${results.length}</td>
                <td>${u.points || 0}</td>
                <td>${avgScore}%</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
      `}
    `;
  } else {
    content.innerHTML = `
      <h3>📚 Subjects & Quizzes</h3>
      <div class="subjects-grid">
        ${subjects.map(s => `
          <div class="subject-card">
            <div class="subject-name">📘 ${s.name}</div>
            <div>${s.questions.length} questions</div>
            <div>🎯 Pass: ${s.passingScore}% | ⏱️ ${Math.floor(s.timeLimit / 60)} min</div>
          </div>
        `).join('')}
      </div>
    `;
  }
}

async function approveUser(userId) {
  const user = users.find(u => u.id === userId);
  if (user) {
    await approveUser(userId);
    showToast(`✅ ${user.name} has been approved! They can now login.`);
    renderAdminDashboard();
  }
}

// ============================================
// INITIALIZE APP
// ============================================

async function init() {
  const savedUser = sessionStorage.getItem('lms_current_user');
  if (savedUser) {
    currentUser = JSON.parse(savedUser);
    await fetchUsers();
    await fetchSubjects();
    
    if (currentUser.role === 'admin') {
      renderAdminDashboard();
    } else {
      // Check if user still exists and is approved
      const updatedUser = users.find(u => u.id === currentUser.id);
      if (updatedUser && updatedUser.status === 'approved') {
        renderStudentDashboard();
      } else {
        sessionStorage.removeItem('lms_current_user');
        renderAuthScreen();
      }
    }
  } else {
    renderAuthScreen();
  }
}

// Start the app
init();
</script>
</body>
</html>
