<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS Cloud - Working Version</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  .auth-card h2 { margin-bottom: 10px; color: #333; }
  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
  .input-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
  .btn { padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 16px; }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; width: 100%; }
  .btn-outline { background: transparent; border: 2px solid #667eea; color: #667eea; }
  .switch-link { text-align: center; margin-top: 20px; color: #666; }
  .switch-link a { color: #667eea; cursor: pointer; text-decoration: underline; }
  .app-header { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .logo h1 { font-size: 1.5rem; color: #667eea; }
  .user-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 8px 16px; border-radius: 50px; }
  .status-badge { padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; }
  .status-approved { background: #4caf50; color: white; }
  .status-pending { background: #ff9800; color: white; }
  .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: white; border-radius: 16px; padding: 20px; text-align: center; }
  .stat-number { font-size: 2rem; font-weight: bold; color: #667eea; }
  .section { background: white; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
  .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  .subject-card { background: #f8f9fa; border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s; }
  .subject-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  .quiz-container { background: #f8f9fa; border-radius: 20px; padding: 24px; }
  .question-text { font-size: 1.2rem; margin-bottom: 20px; }
  .option { padding: 12px; background: white; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
  .option.selected { border-color: #667eea; background: #f0f0ff; }
  .timer { font-size: 1.5rem; text-align: center; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 12px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; }
  th { background: #f8f9fa; }
  .icon-btn { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; margin: 2px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1000; }
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .admin-tab { padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 50px; cursor: pointer; }
  .admin-tab.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  @media (max-width: 768px) { .auth-card { margin: 20px; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================
// REPLACE THIS WITH YOUR GOOGLE SCRIPT URL
// ============================================
const API_URL = "https://script.google.com/macros/s/AKfycbyQkcmbQaLRZpTsInrUMTJ8j5zb4qRbomRkXpE74aUc5WFMH6QTNSDY6IpfWTIHAKC1mA/exec";

let currentUser = null;
let users = [];
let subjects = [];

// ============================================
// CLOUD FUNCTIONS
// ============================================

async function fetchFromCloud() {
  try {
    const response = await fetch(`${API_URL}?t=${Date.now()}`);
    const data = await response.json();
    if (data.users) users = data.users;
    if (data.subjects) subjects = data.subjects;
    return true;
  } catch (err) {
    console.error("Fetch error:", err);
    showToast("⚠️ Cannot connect to server. Please check your internet.", true);
    return false;
  }
}

async function registerToCloud(name, email, password) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: "register", name, email, password })
    });
    const data = await response.json();
    return data;
  } catch (err) {
    console.error("Register error:", err);
    return { error: err.message };
  }
}

async function approveUserInCloud(userId) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: "approveUser", id: userId })
    });
    return await response.json();
  } catch (err) {
    return { error: err.message };
  }
}

async function saveResultToCloud(userId, subjectId, score, correct, total, points) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: "saveResult", userId, subjectId, score, correct, total, points })
    });
    return await response.json();
  } catch (err) {
    return { error: err.message };
  }
}

function showToast(msg, isError = false) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  toast.style.background = isError ? '#f44336' : '#333';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ============================================
// AUTH SCREENS
// ============================================

async function renderAuthScreen() {
  await fetchFromCloud();
  
  document.getElementById('app').innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <h2>📚 LMS Cloud</h2>
        <p style="color: #666; margin-bottom: 30px;">Cross-Device Learning System</p>
        <div id="authForm">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter your name">
          </div>
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Enter your email">
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password">
          </div>
          <button class="btn btn-primary" onclick="register()">Register as Student</button>
          <div class="switch-link">
            Already have an account? <a onclick="showLogin()">Login here</a>
          </div>
          <div class="switch-link">
            Admin login? <a onclick="showAdminLogin()">Admin Access</a>
          </div>
        </div>
      </div>
    </div>
  `;
}

function showLogin() {
  document.getElementById('authForm').innerHTML = `
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
    </div>
    <button class="btn btn-primary" onclick="login()">Student Login</button>
    <div class="switch-link">
      Don't have an account? <a onclick="renderAuthScreen()">Register here</a>
    </div>
    <div class="switch-link">
      Admin login? <a onclick="showAdminLogin()">Admin Access</a>
    </div>
  `;
}

function showAdminLogin() {
  document.getElementById('authForm').innerHTML = `
    <div class="input-group">
      <label>Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@lms.com">
    </div>
    <div class="input-group">
      <label>Admin Password</label>
      <input type="password" id="adminPassword" placeholder="admin123">
    </div>
    <button class="btn btn-primary" onclick="adminLogin()">Admin Login</button>
    <div class="switch-link">
      Student login? <a onclick="showLogin()">Student Login</a>
    </div>
  `;
}

async function register() {
  const name = document.getElementById('regName')?.value.trim();
  const email = document.getElementById('regEmail')?.value.trim();
  const password = document.getElementById('regPassword')?.value;
  
  if (!name || !email || !password) {
    showToast('Please fill all fields', true);
    return;
  }
  
  showToast('Registering...');
  
  const result = await registerToCloud(name, email, password);
  
  if (result.error) {
    showToast(result.error, true);
  } else if (result.success) {
    showToast('✅ Registration successful! Admin will approve you soon.');
    showLogin();
  } else {
    showToast('Registration failed. Please try again.', true);
  }
}

async function login() {
  const email = document.getElementById('loginEmail')?.value;
  const password = document.getElementById('loginPassword')?.value;
  
  await fetchFromCloud();
  const user = users.find(u => u.email === email && u.password === password && u.role === 'student');
  
  if (!user) {
    showToast('Invalid email or password', true);
    return;
  }
  
  if (user.status !== 'approved') {
    showToast(`Your account is ${user.status}. Please wait for admin approval.`, true);
    return;
  }
  
  currentUser = user;
  sessionStorage.setItem('lms_current_user', JSON.stringify(currentUser));
  renderStudentDashboard();
}

async function adminLogin() {
  const email = document.getElementById('adminEmail')?.value;
  const password = document.getElementById('adminPassword')?.value;
  
  await fetchFromCloud();
  const admin = users.find(u => u.email === email && u.password === password && u.role === 'admin');
  
  if (!admin) {
    showToast('Invalid admin credentials. Use admin@lms.com / admin123', true);
    return;
  }
  
  currentUser = admin;
  sessionStorage.setItem('lms_current_user', JSON.stringify(currentUser));
  renderAdminDashboard();
  
  const pendingCount = users.filter(u => u.status === 'pending').length;
  showToast(`Welcome Admin! ${pendingCount} student(s) pending approval.`);
}

function logout() {
  sessionStorage.removeItem('lms_current_user');
  currentUser = null;
  renderAuthScreen();
}

// ============================================
// STUDENT DASHBOARD
// ============================================

let selectedSubject = null;
let currentQuestionIndex = 0;
let userAnswers = {};
let timerInterval = null;
let timeRemaining = 0;

async function renderStudentDashboard() {
  await fetchFromCloud();
  
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="container">
      <div class="app-header">
        <div class="logo"><h1>📚 Student Portal</h1></div>
        <div class="user-info">
          <span class="user-badge">👤 ${currentUser.name}</span>
          <span class="status-badge status-approved">✅ Approved</span>
          <button class="btn btn-outline" onclick="logout()" style="padding: 8px 16px;">Logout</button>
        </div>
      </div>
      
      <div class="dashboard-stats">
        <div class="stat-card"><div class="stat-number">${currentUser.points || 0}</div><div>🏆 Points</div></div>
        <div class="stat-card"><div class="stat-number">${currentUser.results?.length || 0}</div><div>📊 Tests Taken</div></div>
      </div>
      
      <div class="section">
        <h3>📖 Available Subjects</h3>
        <div class="subjects-grid" id="subjectsGrid"></div>
      </div>
      
      <div id="quizArea" style="display: none;"></div>
    </div>
  `;
  
  const grid = document.getElementById('subjectsGrid');
  if (grid) {
    grid.innerHTML = subjects.map(sub => `
      <div class="subject-card" onclick="startQuiz(${sub.id})">
        <div class="subject-name">📘 ${sub.name}</div>
        <div>${sub.questions.length} questions</div>
      </div>
    `).join('');
  }
}

function startQuiz(subjectId) {
  selectedSubject = subjects.find(s => s.id === subjectId);
  currentQuestionIndex = 0;
  userAnswers = {};
  timeRemaining = selectedSubject.timeLimit;
  renderQuiz();
  startTimer();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timeRemaining <= 0) {
      clearInterval(timerInterval);
      submitQuiz(true);
    } else {
      timeRemaining--;
      const timerDiv = document.getElementById('timerDisplay');
      if (timerDiv) {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        timerDiv.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
      }
    }
  }, 1000);
}

function renderQuiz() {
  const qa = document.getElementById('quizArea');
  const q = selectedSubject.questions[currentQuestionIndex];
  
  qa.style.display = 'block';
  qa.innerHTML = `
    <div class="section">
      <h3>${selectedSubject.name} Quiz</h3>
      <div class="timer" id="timerDisplay"></div>
      <div class="quiz-container">
        <div style="margin-bottom: 10px;">Question ${currentQuestionIndex + 1} of ${selectedSubject.questions.length}</div>
        <div class="question-text">${q.text}</div>
        <div id="optionsList"></div>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
          <button class="btn btn-outline" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>◀ Previous</button>
          <button class="btn btn-primary" onclick="nextQuestion()">${currentQuestionIndex === selectedSubject.questions.length - 1 ? 'Submit' : 'Next ▶'}</button>
        </div>
      </div>
    </div>
  `;
  
  renderOptions();
  updateTimerDisplay();
}

function renderOptions() {
  const optsDiv = document.getElementById('optionsList');
  const q = selectedSubject.questions[currentQuestionIndex];
  const savedAnswer = userAnswers[currentQuestionIndex];
  
  optsDiv.innerHTML = q.options.map((opt, idx) => `
    <div class="option ${savedAnswer === idx ? 'selected' : ''}" onclick="selectAnswer(${idx})">
      ${String.fromCharCode(65 + idx)}. ${opt}
    </div>
  `).join('');
}

function selectAnswer(idx) {
  userAnswers[currentQuestionIndex] = idx;
  renderOptions();
}

function previousQuestion() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderQuiz();
  }
}

function nextQuestion() {
  if (currentQuestionIndex === selectedSubject.questions.length - 1) {
    submitQuiz(false);
  } else {
    currentQuestionIndex++;
    renderQuiz();
  }
}

async function submitQuiz(isTimeout) {
  if (timerInterval) clearInterval(timerInterval);
  
  let correct = 0;
  let points = 0;
  
  selectedSubject.questions.forEach((q, idx) => {
    if (userAnswers[idx] === q.correct) {
      correct++;
      points += q.points;
    }
  });
  
  const score = Math.round((correct / selectedSubject.questions.length) * 100);
  
  await saveResultToCloud(currentUser.id, selectedSubject.id, score, correct, selectedSubject.questions.length, points);
  await fetchFromCloud();
  
  // Update current user
  const updatedUser = users.find(u => u.id === currentUser.id);
  if (updatedUser) currentUser = updatedUser;
  sessionStorage.setItem('lms_current_user', JSON.stringify(currentUser));
  
  showToast(`Score: ${score}% ${score >= 60 ? '🎉 Passed!' : '📚 Keep practicing'}`);
  renderStudentDashboard();
}

// ============================================
// ADMIN DASHBOARD
// ============================================

let adminActiveTab = 'users';

async function renderAdminDashboard() {
  await fetchFromCloud();
  
  const pendingCount = users.filter(u => u.status === 'pending').length;
  const studentCount = users.filter(u => u.role === 'student').length;
  
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="container">
      <div class="app-header">
        <div class="logo"><h1>👑 Admin Portal</h1></div>
        <div class="user-info">
          <span class="user-badge">Admin: ${currentUser.name}</span>
          <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
      </div>
      
      <div class="dashboard-stats">
        <div class="stat-card"><div class="stat-number">${studentCount}</div><div>Total Students</div></div>
        <div class="stat-card"><div class="stat-number" style="color: #ff9800;">${pendingCount}</div><div>Pending Approvals</div></div>
        <div class="stat-card"><div class="stat-number">${subjects.length}</div><div>Subjects</div></div>
      </div>
      
      <div class="section">
        <div class="admin-tabs">
          <button class="admin-tab ${adminActiveTab === 'users' ? 'active' : ''}" onclick="switchAdminTab('users')">👥 User Management</button>
          <button class="admin-tab ${adminActiveTab === 'subjects' ? 'active' : ''}" onclick="switchAdminTab('subjects')">📚 Subjects</button>
        </div>
        <div id="adminContent"></div>
      </div>
    </div>
  `;
  
  renderAdminContent();
}

function switchAdminTab(tab) {
  adminActiveTab = tab;
  renderAdminDashboard();
}

function renderAdminContent() {
  const content = document.getElementById('adminContent');
  
  if (adminActiveTab === 'users') {
    const pending = users.filter(u => u.role === 'student' && u.status === 'pending');
    const approved = users.filter(u => u.role === 'student' && u.status === 'approved');
    
    content.innerHTML = `
      <h3>⏳ Pending Approvals (${pending.length})</h3>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Registered</th><th>Action</th></tr></thead>
        <tbody>
          ${pending.map(u => `
            <tr>
              <td>${u.name}</td>
              <td>${u.email}</td>
              <td>${new Date(u.registeredAt).toLocaleDateString()}</td>
              <td><button class="icon-btn" style="background:#4caf50;color:white;" onclick="approveUser(${u.id})">✅ Approve</button></td>
            </tr>
          `).join('')}
          ${pending.length === 0 ? '<tr><td colspan="4" style="text-align:center;">No pending approvals</td></tr>' : ''}
        </tbody>
      </table>
      
      <h3 style="margin-top: 30px;">✅ Approved Students (${approved.length})</h3>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Tests Taken</th><th>Points</th></tr></thead>
        <tbody>
          ${approved.map(u => `
            <tr>
              <td>${u.name}</td>
              <td>${u.email}</td>
              <td>${u.results?.length || 0}</td>
              <td>${u.points || 0}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else {
    content.innerHTML = `
      <h3>📚 Subjects</h3>
      <div class="subjects-grid">
        ${subjects.map(s => `
          <div class="subject-card">
            <div class="subject-name">📘 ${s.name}</div>
            <div>${s.questions.length} questions</div>
            <div>Passing: ${s.passingScore}%</div>
          </div>
        `).join('')}
      </div>
    `;
  }
}

async function approveUser(id) {
  const user = users.find(u => u.id === id);
  if (user) {
    await approveUserInCloud(id);
    await fetchFromCloud();
    renderAdminDashboard();
    showToast(`✅ ${user.name} has been approved!`);
  }
}

// ============================================
// INITIALIZE
// ============================================

const savedUser = sessionStorage.getItem('lms_current_user');
if (savedUser) {
  currentUser = JSON.parse(savedUser);
  if (currentUser.role === 'admin') {
    renderAdminDashboard();
  } else {
    renderStudentDashboard();
  }
} else {
  renderAuthScreen();
}
</script>
</body>
</html>
